[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sak-modern"
version = "1.0.0"
description = "Switch Army Knife Modern - cross-platform NSP/XCI bundle, convert, and inspection tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SAK Modern contributors"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
sak-modern = "sak_modern.cli:main"
sak-modern-gui = "sak_modern.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sak_modern = ["resources/*"]
